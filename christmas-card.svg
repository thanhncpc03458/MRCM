<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Thiệp chúc mừng Giáng Sinh</title>
  <desc id="desc">Thiệp Giáng Sinh với cây thông, tuyết và lời chúc an lành.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102c4c"/>
      <stop offset="1" stop-color="#1d5b70"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9eef2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .twinkle { animation: twinkle 1.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .twinkle:nth-child(2n) { animation-delay: .6s; }
      .twinkle:nth-child(3n) { animation-delay: 1.1s; }
      .snowflake { animation: fall 8s linear infinite; }
      .snowflake:nth-child(2n) { animation-duration: 11s; animation-delay: -4s; }
      .snowflake:nth-child(3n) { animation-duration: 13s; animation-delay: -7s; }
      @keyframes twinkle { from { opacity: .35; transform: scale(.75); } to { opacity: 1; transform: scale(1.25); } }
      @keyframes fall { from { transform: translateY(-80px) rotate(0deg); } to { transform: translateY(900px) rotate(360deg); } }
    </style>
  </defs>

  <rect width="1200" height="800" rx="34" fill="url(#sky)"/>
  <circle cx="980" cy="145" r="72" fill="#fff5c4" opacity=".92" filter="url(#glow)"/>
  <circle cx="980" cy="145" r="52" fill="#fff9d8"/>

  <g fill="#fff" opacity=".82">
    <circle cx="95" cy="112" r="4"/><circle cx="205" cy="205" r="3"/>
    <circle cx="343" cy="82" r="5"/><circle cx="472" cy="170" r="3"/>
    <circle cx="625" cy="98" r="4"/><circle cx="776" cy="205" r="5"/>
    <circle cx="1110" cy="72" r="3"/><circle cx="1140" cy="270" r="4"/>
  </g>

  <g fill="#fff" opacity=".85">
    <circle class="snowflake" cx="55" cy="-20" r="5"/>
    <circle class="snowflake" cx="170" cy="-90" r="3"/>
    <circle class="snowflake" cx="300" cy="-40" r="4"/>
    <circle class="snowflake" cx="440" cy="-120" r="5"/>
    <circle class="snowflake" cx="570" cy="-30" r="3"/>
    <circle class="snowflake" cx="700" cy="-100" r="4"/>
    <circle class="snowflake" cx="840" cy="-55" r="5"/>
    <circle class="snowflake" cx="1010" cy="-125" r="3"/>
    <circle class="snowflake" cx="1150" cy="-15" r="4"/>
  </g>

  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".75">
    <path d="M140 300v28m-14-14h28m-24-10 20 20m0-20-20 20"/>
    <path d="M1090 350v28m-14-14h28m-24-10 20 20m0-20-20 20"/>
    <path d="M730 270v20m-10-10h20"/>
  </g>

  <path d="M0 595 Q220 535 430 600 T850 585 T1200 600 V800 H0Z" fill="url(#snow)"/>
  <path d="M0 660 Q235 610 455 665 T900 655 T1200 670 V800 H0Z" fill="#c6e5ea" opacity=".65"/>

  <g transform="translate(145 220)">
    <path d="M190 410h74l-10 86h-54z" fill="#75452f"/>
    <path d="M227 20 95 205h75L40 350h105L0 490h454L345 350h104L314 205h76z" fill="#0c493f"/>
    <path d="m227 20-30 42h58zM95 205h264l-31 42H126zM40 350h374l-34 45H74z" fill="#d8f1ed" opacity=".9"/>
    <g fill="#f3c75f">
      <circle class="twinkle" cx="143" cy="280" r="10"/><circle class="twinkle" cx="294" cy="245" r="10"/>
      <circle class="twinkle" cx="104" cy="390" r="10"/><circle class="twinkle" cx="347" cy="370" r="10"/>
      <circle class="twinkle" cx="224" cy="430" r="10"/>
    </g>
    <path d="m227 0 12 27 30 3-23 20 7 30-26-16-26 16 7-30-23-20 30-3z" fill="#f7d469" filter="url(#glow)"/>
  </g>

  <g text-anchor="middle" fill="#fffaf0">
    <text x="760" y="350" font-family="Georgia, serif" font-size="68" font-weight="bold">Merry Christmas</text>
    <text x="760" y="425" font-family="Arial, sans-serif" font-size="34" letter-spacing="3">CHÚC MỪNG GIÁNG SINH</text>
    <path d="M535 458h450" stroke="#f3c75f" stroke-width="3"/>
    <text x="760" y="520" font-family="Arial, sans-serif" font-size="25">Chúc bạn và gia đình một mùa Noel</text>
    <text x="760" y="560" font-family="Arial, sans-serif" font-size="25">ấm áp, an lành và tràn ngập yêu thương!</text>
  </g>

  <g fill="#fff" opacity=".9">
    <circle cx="515" cy="635" r="5"/><circle cx="585" cy="690" r="3"/>
    <circle cx="700" cy="625" r="4"/><circle cx="870" cy="680" r="5"/>
    <circle cx="1010" cy="620" r="3"/><circle cx="1090" cy="700" r="4"/>
  </g>
</svg>
